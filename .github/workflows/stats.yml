name: Update GitHub Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: GitHub Stats Card
        uses: anuraghazra/github-readme-stats@master
        with:
          USERNAME: g-barreto00
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
